<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Console | HealthLink{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --admin-bg: #f8fafc;
            --nav-dark: #0f172a; /* Deep Slate */
            --accent-green: #10b981; /* Success/Admin Color */
            --accent-blue: #3b82f6;
        }

        body {
            background-color: var(--admin-bg);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* Modern Admin Navbar */
        .admin-navbar {
            background-color: var(--nav-dark) !important;
            padding: 0.8rem 0;
            border-bottom: 4px solid var(--accent-blue);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
        }

        .admin-label {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            font-size: 0.65rem;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 6px;
            margin-left: 10px;
            letter-spacing: 1px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Nav Link Styling */
        .nav-link {
            color: rgba(255, 255, 255, 0.7) !important;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 5px;
            padding: 10px 18px !important;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Active Link State */
        .nav-link.active-admin {
            color: #fff !important;
            background: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Action Buttons */
        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #fff !important;
        }

        /* Main Content Padding */
        .admin-main {
            padding: 3rem 0;
            min-height: 85vh;
        }

        footer {
            background: #fff;
            padding: 20px 0;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar sticky-top shadow">
        <div class="container">
            <a class="navbar-brand text-white" href="{% url 'admin-home' %}">
                <i class="fa-solid fa-gauge-high me-2 text-info"></i>
                Health<span class="text-info">Admin</span>
                <span class="admin-label">Console v1.0</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="adminNavbar">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'admin-home' %}active-admin{% endif %}" href="{% url 'admin-home' %}">
                            <i class="fa-solid fa-house-chimney me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'admin-department' %}active-admin{% endif %}" href="{% url 'admin-department' %}">
                            <i class="fa-solid fa-building-medical me-1"></i> Departments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'admin-appointment-list' %}active-admin{% endif %}" href="{% url 'admin-appointment-list' %}">
                            <i class="fa-solid fa-calendar-check me-1"></i> Appointments
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn-logout px-3" href="{% url 'logout' %}">
                            <i class="fa-solid fa-power-off me-1"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="admin-main container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0 fw-bold">ADMINISTRATIVE TERMINAL</p>
            <small>Authorized Access Only — IP: {{ request.META.REMOTE_ADDR }}</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
