<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Patient Portal | HealthLink{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #0f172a;
            --accent-blue: #38bdf8;
            --bg-body: #f1f5f9;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }

        /* Modernized Navbar */
        .navbar {
            background-color: var(--primary-dark) !important;
            padding: 0.8rem 0;
            border-bottom: 3px solid var(--accent-blue);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 8px;
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .nav-link:hover {
            color: var(--accent-blue) !important;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Active Link Styling */
        .nav-link.active-med {
            color: white !important;
            background: rgba(56, 189, 248, 0.2);
        }

        .btn-add-patient {
            background-color: var(--accent-blue);
            color: var(--primary-dark) !important;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-add-patient:hover {
            background-color: white;
            transform: translateY(-1px);
        }

        /* Wrapper for dashboard content */
        .content-wrapper {
            min-height: calc(100vh - 160px);
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        /* Footer */
        footer {
            background-color: white;
            border-top: 1px solid #e2e8f0;
            padding: 1.5rem 0;
            color: #64748b;
            font-size: 0.9rem;
        }

        .logout-link {
            color: #fb7185 !important; /* Soft Red */
        }
        
        .logout-link:hover {
            background: rgba(251, 113, 133, 0.1) !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'patient-home' %}">
                <i class="fa-solid fa-house-medical me-2 text-info"></i>
                Health<span class="text-info">Link</span> Portal
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.resolver_match.url_name == 'patient-home' %}active-med{% endif %}" href="{% url 'patient-home' %}">
                            <i class="fa-solid fa-chart-line me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.resolver_match.url_name == 'patient-appointments' %}active-med{% endif %}" href="{% url 'patient-appointments' %}">
                            <i class="fa-solid fa-calendar-check me-1"></i> My Appointments
                        </a>
                    </li>
                    <li class="nav-item mx-1">
                      <a class="nav-link btn-add-patient ms-lg-2 px-3" href="{% url 'add-patient-default' %}">
                         <i class="fa-solid fa-plus-circle me-1"></i> New Patient
                      </a>
                    </li>
                    <li class="nav-item mx-1">
                        <a class="nav-link logout-link ms-lg-3" href="{% url 'logout' %}">
                            <i class="fa-solid fa-power-off"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="content-wrapper container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <p class="mb-0">&copy; 2026 HealthLink International Hospital. All Secure Records.</p>
                    <small class="text-muted">Connected as Patient: {{ request.user.username }}</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
